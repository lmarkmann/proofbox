[project]
name = "proofbox-api"
version = "0.10.0"
description = "ProofBox API"
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard]>=0.143.3",
  "httpx>=0.28.1",
  "openai>=3.33.0",
  "pyarrow>=23.0.1",
  "uvicorn>=0.54.0",
  "vastdb>=2.1.0",
  "weave>=0.53.12",
]

[project.scripts]
proofbox-api = "proofbox_api:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes (unused imports, undefined names)
  "I", # isort (import sorting)
  "UP", # pyupgrade (modernize syntax)
  "B", # flake8-bugbear (likely bugs)
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
  "C4", # flake8-comprehensions
  "RET", # flake8-return
  "PIE", # flake8-pie
]
ignore = [
  "E501", # line too long, the formatter handles wrapping
]

[tool.ruff.lint.isort]
known-first-party = ["proofbox_api"]
combine-as-imports = true

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src", "tests"]
search-path = ["tests"]

[dependency-groups]
dev = ["httpx2>=2.13.1", "pyrefly>=1.4.0", "pytest>=9.1.1", "ruff>=0.17.1"]
