[project]
name = "proofbox-printer"
version = "0.6.0"
description = "ProofBox label printer agent"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.143.3",
  "libusb-package>=1.0.30.0",
  "pillow>=13.0.0",
  "pyusb>=1.3.1",
  "resvg-py>=0.5.0",
  "segno>=1.6.6",
  "uvicorn>=0.54.0",
]

[project.scripts]
proofbox-printer = "proofbox_printer:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes (unused imports, undefined names)
  "I", # isort (import sorting)
  "UP", # pyupgrade (modernize syntax)
  "B", # flake8-bugbear (likely bugs)
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
  "C4", # flake8-comprehensions
  "RET", # flake8-return
  "PIE", # flake8-pie
]
ignore = [
  "E501", # line too long, the formatter handles wrapping
]

[tool.ruff.lint.isort]
known-first-party = ["proofbox_printer"]
combine-as-imports = true

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src", "tests"]

[dependency-groups]
dev = ["httpx2>=2.13.1", "pyrefly>=1.4.0", "pytest>=9.1.1", "ruff>=0.17.1", "zxing-cpp>=3.1.1"]
