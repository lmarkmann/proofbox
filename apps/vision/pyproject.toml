[project]
name = "proofbox-vision"
version = "0.9.0"
description = "ProofBox live item detection agent"
requires-python = ">=3.14"
dependencies = [
  "clip @ git+https://github.com/ultralytics/CLIP.git",
  "fastapi>=0.143.3",
  "httpx>=0.28.1",
  "lap>=0.5.12",
  "pillow>=13.0.0",
  "typer>=0.27.3",
  "ultralytics>=8.4.0",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
proofbox-vision = "proofbox_vision:main"
proofbox-replay = "proofbox_vision.replay:cli"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes (unused imports, undefined names)
  "I", # isort (import sorting)
  "UP", # pyupgrade (modernize syntax)
  "B", # flake8-bugbear (likely bugs)
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
  "C4", # flake8-comprehensions
  "RET", # flake8-return
  "PIE", # flake8-pie
]
ignore = [
  "E501", # line too long, the formatter handles wrapping
]

[tool.ruff.lint.isort]
known-first-party = ["proofbox_vision"]
combine-as-imports = true

[tool.pyrefly]
python-version = "3.14"
project-includes = ["src", "tests"]

[dependency-groups]
dev = ["httpx2>=2.13.1", "pyrefly>=1.4.0", "pytest>=9.1.1", "ruff>=0.17.1"]
