name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - name: uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          prune-cache: true
      - name: tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: zizmor
          fallback: none
      - name: versions agree
        run: pnpm run version:check
      - name: web check
        run: pnpm exec vp check
      - name: web build
        run: pnpm exec vp run web#build
      - name: worker config
        working-directory: apps/web
        run: pnpm exec wrangler deploy --dry-run
      - name: api sync
        working-directory: apps/api
        run: uv sync --locked
      - name: api format
        working-directory: apps/api
        run: uv run --locked ruff format --check
      - name: api lint
        working-directory: apps/api
        run: uv run --locked ruff check --output-format=github
      - name: api types
        working-directory: apps/api
        run: uv run --locked pyrefly check --output-format=full-text-with-github
      - name: api test
        working-directory: apps/api
        run: uv run --locked pytest -q
      - name: printer sync
        working-directory: apps/printer
        run: uv sync --locked
      - name: printer format
        working-directory: apps/printer
        run: uv run --locked ruff format --check
      - name: printer lint
        working-directory: apps/printer
        run: uv run --locked ruff check --output-format=github
      - name: printer types
        working-directory: apps/printer
        run: uv run --locked pyrefly check --output-format=full-text-with-github
      - name: printer test
        working-directory: apps/printer
        run: uv run --locked pytest -q
      # syncing apps/vision pulls CUDA torch on Linux, so CI only formats and lints it
      - name: vision format
        working-directory: apps/vision
        run: uvx ruff format --check
      - name: vision lint
        working-directory: apps/vision
        run: uvx ruff check --output-format=github
      - name: workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zizmor --format=github .
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  deploy:
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://proofbox.luis-markmann.workers.dev
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: false
          require-lockfile: true
      - name: build
        run: pnpm exec vp run web#build
      - name: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
