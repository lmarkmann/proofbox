packages:
  - apps/*

catalogMode: prefer

catalog:
  "@changesets/cli": ^3.0.3
  "@types/node": ^24
  "@workos-inc/authkit-react": ^0.16.3
  react-error-boundary: ^6.1.6
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  wrangler: ^4.151.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
