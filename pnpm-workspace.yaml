packages:
  - apps/*

catalogMode: prefer

catalog:
  "@changesets/cli": ^3.0.3
  "@types/node": ^24
  "@workos-inc/authkit-react": ^0.16.3
  barcode-detector: ^3.2.2
  react-error-boundary: ^6.1.6
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  wrangler: ^4.151.1
  # barcode-detector pins zxing-wasm exactly; the self-hosted .wasm must match its glue code
  zxing-wasm: 3.1.3
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
